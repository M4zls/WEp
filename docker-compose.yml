services:
  db:
    image: postgres:16-alpine
    container_name: wep-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wep-network

  ms-auth:
    build:
      context: ./backend/ms-auth
      dockerfile: Dockerfile
    container_name: ms-auth-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_auth
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-students:
    build:
      context: ./backend/ms-students
      dockerfile: Dockerfile
    container_name: ms-students-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_students
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-teachers:
    build:
      context: ./backend/ms-teachers
      dockerfile: Dockerfile
    container_name: ms-teachers-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_teachers
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-notifications:
    build:
      context: ./backend/ms-notifications
      dockerfile: Dockerfile
    container_name: ms-notifications-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_notifications
      - MS_STUDENTS_SERVICE=http://ms-students:3001
      - MS_AUTH_SERVICE=http://ms-auth:3002
      - NOVU_SECRET_KEY=${NOVU_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-courses:
    build:
      context: ./backend/ms-courses
      dockerfile: Dockerfile
    container_name: ms-courses-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_courses
      - MS_TEACHERS_SERVICE=http://ms-teachers:3004
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-classes:
    build:
      context: ./backend/ms-classes
      dockerfile: Dockerfile
    container_name: ms-classes-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_classes
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-schedule:
    build:
      context: ./backend/ms-schedule
      dockerfile: Dockerfile
    container_name: ms-schedule-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_schedule
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-attendance:
    build:
      context: ./backend/ms-attendance
      dockerfile: Dockerfile
    container_name: ms-attendance-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_attendance
      - MS_NOTIFICATIONS_SERVICE=http://ms-notifications:3003
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-messaging:
    build:
      context: ./backend/ms-messaging
      dockerfile: Dockerfile
    container_name: ms-messaging-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_messaging
      - MS_NOTIFICATIONS_SERVICE=http://ms-notifications:3003
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  ms-grades:
    build:
      context: ./backend/ms-grades
      dockerfile: Dockerfile
    container_name: ms-grades-service
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep_grades
      - MS_STUDENTS_SERVICE=http://ms-students:3001
      - MS_TEACHERS_SERVICE=http://ms-teachers:3004
      - MS_NOTIFICATIONS_SERVICE=http://ms-notifications:3003
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  krakend:
    image: krakend:2.13
    container_name: krakend-service
    ports:
      - "3100:8080"
    volumes:
      - ./backend/krakend:/etc/krakend
    depends_on:
      - ms-auth
      - ms-students
      - ms-teachers
      - ms-notifications
      - ms-courses
      - ms-classes
      - ms-schedule
      - ms-attendance
      - ms-messaging
      - ms-grades
    networks:
      - wep-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "8080:8080"
    depends_on:
      - krakend
    networks:
      - wep-network

volumes:
  pgdata:

networks:
  wep-network:
    driver: bridge
