services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: wep-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wep
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wep-network

  # Backend - Microservicio de Autenticación
  ms.authentication:
    build:
      context: ./backend/ms.authentication
      dockerfile: Dockerfile
    container_name: ms.authentication-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Estudiantes
  ms.students:
    build:
      context: ./backend/ms.students
      dockerfile: Dockerfile
    container_name: ms.students-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Profesores
  ms.teachers:
    build:
      context: ./backend/ms.teachers
      dockerfile: Dockerfile
    container_name: ms.teachers-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Notificaciones
  ms.notifications:
    build:
      context: ./backend/ms.notifications
      dockerfile: Dockerfile
    container_name: ms.notifications-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
      - NOVU_SECRET_KEY=${NOVU_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Cursos
  ms.courses:
    build:
      context: ./backend/ms.courses
      dockerfile: Dockerfile
    container_name: ms.courses-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Clases
  ms.classes:
    build:
      context: ./backend/ms.classes
      dockerfile: Dockerfile
    container_name: ms.classes-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - BFF (Backend for Frontend)
  bff:
    build:
      context: ./backend/bff
      dockerfile: Dockerfile
    container_name: bff-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MS_AUTHENTICATION_SERVICE=http://ms.authentication:3002
      - MS_STUDENTS_SERVICE=http://ms.students:3001
      - MS_TEACHERS_SERVICE=http://ms.teachers:3004
      - MS_NOTIFICATIONS_SERVICE=http://ms.notifications:3003
      - MS_COURSES_SERVICE=http://ms.courses:3005
      - MS_CLASSES_SERVICE=http://ms.classes:3006
      - MS_SCHEDULE_SERVICE=http://ms.schedule:3007
      - MS_ATTENDANCE_SERVICE=http://ms.attendance:3008
      - MS_MESSAGING_SERVICE=http://ms.messaging:3009
      - MS_NOTES_SERVICE=http://ms.notes:3010
    depends_on:
      - ms.authentication
      - ms.students
      - ms.teachers
      - ms.notifications
      - ms.courses
      - ms.classes
      - ms.schedule
      - ms.attendance
      - ms.messaging
      - ms.notes
    networks:
      - wep-network

  # Backend - Microservicio de Horario
  ms.schedule:
    build:
      context: ./backend/ms.schedule
      dockerfile: Dockerfile
    container_name: ms.schedule-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Asistencia
  ms.attendance:
    build:
      context: ./backend/ms.attendance
      dockerfile: Dockerfile
    container_name: ms.attendance-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Mensajería
  ms.messaging:
    build:
      context: ./backend/ms.messaging
      dockerfile: Dockerfile
    container_name: ms.messaging-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Backend - Microservicio de Notas
  ms.notes:
    build:
      context: ./backend/ms.notes
      dockerfile: Dockerfile
    container_name: ms.notes-service
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wep-network

  # Seed database (run once after all services are up)
  seed:
    build:
      context: .
      dockerfile: k8s/jobs/Dockerfile.seed
    container_name: wep-seed
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/wep
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - seed
    networks:
      - wep-network

  # Frontend - React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    ports:
      - "8080:8080"
    environment:
      - REACT_APP_API_URL=http://bff:3000
    depends_on:
      - bff
    networks:
      - wep-network

volumes:
  pgdata:

networks:
  wep-network:
    driver: bridge