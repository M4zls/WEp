apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: wep-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3006
        livenessProbe:
          httpGet:
            path: /
            port: 3006
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3006
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: wep
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 3006
    targetPort: 3006
  type: LoadBalancer