apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-notifications
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-notifications
  template:
    metadata:
      labels:
        app: ms-notifications
    spec:
      containers:
      - name: ms-notifications
        image: docker.io/library/wep-ms-notifications:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3003"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DB_NOTIFICATIONS_URL
        - name: MS_AUTH_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_AUTH_SERVICE
        - name: MS_STUDENTS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_STUDENTS_SERVICE
        - name: SENTRY_DSN
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: SENTRY_DSN
        - name: SENTRY_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: SENTRY_ENVIRONMENT
        - name: SENTRY_TRACES_SAMPLE_RATE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: SENTRY_TRACES_SAMPLE_RATE
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-notifications-service
  namespace: wep
spec:
  selector:
    app: ms-notifications
  ports:
  - protocol: TCP
    port: 3003
    targetPort: 3003
  type: ClusterIP
