apiVersion: apps/v1
kind: Deployment
metadata:
  name: mensajeria
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mensajeria
  template:
    metadata:
      labels:
        app: mensajeria
    spec:
      containers:
      - name: mensajeria
        image: wep-mensajeria:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3009
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3009"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mensajeria-service
  namespace: wep
spec:
  selector:
    app: mensajeria
  ports:
  - protocol: TCP
    port: 3009
    targetPort: 3009
  type: ClusterIP
