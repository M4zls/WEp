apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
      - name: bff
        image: wep-bff:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3000"
        - name: MS_AUTHENTICATION_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_AUTHENTICATION_SERVICE
        - name: MS_STUDENTS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_STUDENTS_SERVICE
        - name: MS_TEACHERS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_TEACHERS_SERVICE
        - name: MS_NOTIFICATIONS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_NOTIFICATIONS_SERVICE
        - name: MS_COURSES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_COURSES_SERVICE
        - name: MS_CLASSES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_CLASSES_SERVICE
        - name: MS_SCHEDULE_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_SCHEDULE_SERVICE
        - name: MS_ATTENDANCE_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_ATTENDANCE_SERVICE
        - name: MS_MESSAGING_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_MESSAGING_SERVICE
        - name: MS_NOTES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MS_NOTES_SERVICE
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: wep
spec:
  selector:
    app: bff
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: LoadBalancer