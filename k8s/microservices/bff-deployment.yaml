apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
      - name: bff
        image: wep-bff:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3000"
        - name: AUTENTIFICACION_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: AUTENTIFICACION_SERVICE
        - name: ESTUDIANTES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: ESTUDIANTES_SERVICE
        - name: PROFESORES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: PROFESORES_SERVICE
        - name: NOTIFICACIONES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NOTIFICACIONES_SERVICE
        - name: CURSOS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: CURSOS_SERVICE
        - name: CLASES_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: CLASES_SERVICE
        - name: HORARIO_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: HORARIO_SERVICE
        - name: ASISTENCIA_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: ASISTENCIA_SERVICE
        - name: MENSAJERIA_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: MENSAJERIA_SERVICE
        - name: NOTAS_SERVICE
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NOTAS_SERVICE
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bff-service
  namespace: wep
spec:
  selector:
    app: bff
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: LoadBalancer