apiVersion: apps/v1
kind: Deployment
metadata:
  name: clases
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clases
  template:
    metadata:
      labels:
        app: clases
    spec:
      containers:
      - name: clases
        image: wep-clases:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3006
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3006"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: clases-service
  namespace: wep
spec:
  selector:
    app: clases
  ports:
  - protocol: TCP
    port: 3006
    targetPort: 3006
  type: ClusterIP
