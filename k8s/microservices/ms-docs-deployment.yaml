apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-docs
  namespace: wep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-docs
  template:
    metadata:
      labels:
        app: ms-docs
    spec:
      containers:
      - name: ms-docs
        image: docker.io/library/wep-ms-docs:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3011
        env:
        - name: PORT
          value: "3011"
        livenessProbe:
          httpGet:
            path: /health
            port: 3011
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3011
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-docs-service
  namespace: wep
spec:
  selector:
    app: ms-docs
  ports:
  - protocol: TCP
    port: 3011
    targetPort: 3011
  type: ClusterIP
