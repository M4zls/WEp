apiVersion: apps/v1
kind: Deployment
metadata:
  name: asistencia
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asistencia
  template:
    metadata:
      labels:
        app: asistencia
    spec:
      containers:
      - name: asistencia
        image: wep-asistencia:20260612-190812
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3008
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3008"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: asistencia-service
  namespace: wep
spec:
  selector:
    app: asistencia
  ports:
  - protocol: TCP
    port: 3008
    targetPort: 3008
  type: ClusterIP


