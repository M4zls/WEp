apiVersion: apps/v1
kind: Deployment
metadata:
  name: estudiantes
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estudiantes
  template:
    metadata:
      labels:
        app: estudiantes
    spec:
      containers:
      - name: estudiantes
        image: wep-estudiantes:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: estudiantes-service
  namespace: wep
spec:
  selector:
    app: estudiantes
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP
