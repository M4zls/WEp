apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-classes
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-classes
  template:
    metadata:
      labels:
        app: ms-classes
    spec:
      containers:
      - name: ms-classes
        image: docker.io/library/wep-ms-classes:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3006
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3006"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DB_CLASSES_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-classes-service
  namespace: wep
spec:
  selector:
    app: ms-classes
  ports:
  - protocol: TCP
    port: 3006
    targetPort: 3006
  type: ClusterIP
