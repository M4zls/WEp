apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-attendance
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-attendance
  template:
    metadata:
      labels:
        app: ms-attendance
    spec:
      containers:
      - name: ms-attendance
        image: docker.io/library/wep-ms-attendance:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3008
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3008"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DB_ATTENDANCE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3008
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-attendance-service
  namespace: wep
spec:
  selector:
    app: ms-attendance
  ports:
  - protocol: TCP
    port: 3008
    targetPort: 3008
  type: ClusterIP
