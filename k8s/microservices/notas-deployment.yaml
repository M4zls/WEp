apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms.notes
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms.notes
  template:
    metadata:
      labels:
        app: ms.notes
    spec:
      containers:
      - name: ms.notes
        image: wep-ms.notes:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3010
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3010"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms.notes-service
  namespace: wep
spec:
  selector:
    app: ms.notes
  ports:
  - protocol: TCP
    port: 3010
    targetPort: 3010
  type: ClusterIP
