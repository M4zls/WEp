apiVersion: apps/v1
kind: Deployment
metadata:
  name: autentificacion
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autentificacion
  template:
    metadata:
      labels:
        app: autentificacion
    spec:
      containers:
      - name: autentificacion
        image: wep-autentificacion:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3002"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: autentificacion-service
  namespace: wep
spec:
  selector:
    app: autentificacion
  ports:
  - protocol: TCP
    port: 3002
    targetPort: 3002
  type: ClusterIP