apiVersion: apps/v1
kind: Deployment
metadata:
  name: horario
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: horario
  template:
    metadata:
      labels:
        app: horario
    spec:
      containers:
      - name: horario
        image: wep-horario:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3007
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3007"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: horario-service
  namespace: wep
spec:
  selector:
    app: horario
  ports:
  - protocol: TCP
    port: 3007
    targetPort: 3007
  type: ClusterIP
