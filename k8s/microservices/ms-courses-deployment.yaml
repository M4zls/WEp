apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-courses
  namespace: wep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-courses
  template:
    metadata:
      labels:
        app: ms-courses
    spec:
      containers:
      - name: ms-courses
        image: wep-ms-courses:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: NODE_ENV
        - name: PORT
          value: "3005"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: wep-config
              key: DATABASE_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ms-courses-service
  namespace: wep
spec:
  selector:
    app: ms-courses
  ports:
  - protocol: TCP
    port: 3005
    targetPort: 3005
  type: ClusterIP
