kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Frontend via NodePort 30080 → host port 8080
  - containerPort: 30080
    hostPort: 8080
    protocol: TCP
  # KrakenD API Gateway via NodePort 31000 → host port 3100
  - containerPort: 31000
    hostPort: 3100
    protocol: TCP
